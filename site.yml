---
site:
  title: OpenShift Virtualization
  url: https://github.com/rhpds/openshift-days-ops-showroom
  start_page: openshift-virtualization::index.adoc

content:
  sources:
    - url: .
      start_path: content

ui:
  bundle:
    url: https://github.com/dialvare/rhdp_showroom_theme/releases/download/v2.0.4-ops/ui-bundle.zip
    snapshot: true
  supplemental_files: ./content/supplemental-ui
  
runtime:
  cache_dir: ./.cache/antora

antora:
  extensions:
    - require: ./content/lib/dev-mode.js
      enabled: false

output:
  dir: ./www

# Module attributes for ifeval conditionals in nav.adoc
# In production, these are injected by the showroom workload via user_data
# For local preview, enable all modules by setting to "true"
asciidoc:
  attributes:
    toclevels: 2
    # Module flags - focused on virtualization only
    module_enable_virt: 'true'
